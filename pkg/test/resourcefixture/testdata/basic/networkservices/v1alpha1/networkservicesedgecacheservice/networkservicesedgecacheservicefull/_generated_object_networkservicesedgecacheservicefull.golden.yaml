apiVersion: networkservices.cnrm.cloud.google.com/v1alpha1
kind: NetworkServicesEdgeCacheService
metadata:
  finalizers:
  - cnrm.cloud.google.com/finalizer
  - cnrm.cloud.google.com/deletion-defender
  generation: 1
  labels:
    cnrm-test: "true"
  name: edgecacheservice-${uniqueId}
  namespace: ${uniqueId}
spec:
  description: Full edge cache service
  disableHttp2: false
  disableQuic: false
  logConfig:
    enable: true
    sampleRate: 1
  projectRef:
    external: ${projectId}
  requireTls: true
  routing:
    hostRule:
    - hosts:
      - '*'
      pathMatcher: path-matcher
    pathMatcher:
    - name: path-matcher
      routeRule:
      - matchRule:
        - prefixMatch: /
        originRef:
          external: projects/${projectId}/locations/global/edgeCacheOrigins/networkservicesedgecacheorigin${uniqueId}
        priority: "2"
        routeAction:
          cdnPolicy:
            cacheMode: CACHE_ALL_STATIC
            clientTtl: 3600s
            defaultTtl: 3600s
            maxTtl: 86400s
status:
  conditions:
  - lastTransitionTime: "1970-01-01T00:00:00Z"
    message: The resource is up to date
    reason: UpToDate
    status: "True"
    type: Ready
  observedGeneration: 1
  observedState: {}
