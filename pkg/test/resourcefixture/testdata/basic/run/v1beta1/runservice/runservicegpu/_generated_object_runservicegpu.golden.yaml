apiVersion: run.cnrm.cloud.google.com/v1beta1
kind: RunService
metadata:
  annotations:
    cnrm.cloud.google.com/management-conflict-prevention-policy: none
  finalizers:
  - cnrm.cloud.google.com/finalizer
  - cnrm.cloud.google.com/deletion-defender
  generation: 2
  labels:
    cnrm-test: "true"
  name: runservice-${uniqueId}
  namespace: ${uniqueId}
spec:
  location: us-central1
  projectRef:
    external: projects/${projectId}
  template:
    containers:
    - image: gcr.io/cloudrun/hello
      resources:
        limits:
          cpu: "4"
          memory: 16Gi
          nvidia.com/gpu: "1"
    gpuZonalRedundancyDisabled: false
    nodeSelector:
      accelerator: nvidia-l4
  traffic:
  - percent: 100
    type: TRAFFIC_TARGET_ALLOCATION_TYPE_LATEST
status:
  conditions:
  - lastTransitionTime: "1970-01-01T00:00:00Z"
    message: The resource is up to date
    reason: UpToDate
    status: "True"
    type: Ready
  createTime: "1970-01-01T00:00:00Z"
  creator: test@google.com
  etag: abcdef123456
  externalRef: projects/${projectId}/locations/us-central1/services/runservice-${uniqueId}
  lastModifiedCookie: normalized-cookie
  lastModifier: test@google.com
  observedGeneration: 2
  template:
    containers:
    - {}
  terminalCondition:
  - lastTransitionTime: "1970-01-01T00:00:00Z"
    state: CONDITION_SUCCEEDED
    type: Ready
  uid: "12345678"
  updateTime: "1970-01-01T00:00:00Z"
